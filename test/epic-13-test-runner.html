<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Epic 13: Cognitive Metrics Tests</title>
  <style>
    body {
      font-family: 'Courier New', monospace;
      background: #1a1a1a;
      color: #00ff00;
      padding: 20px;
      line-height: 1.6;
    }
    h1 {
      color: #00ff00;
      border-bottom: 2px solid #00ff00;
      padding-bottom: 10px;
    }
    h2 {
      color: #ffaa00;
      margin-top: 30px;
    }
    .test-section {
      background: #0a0a0a;
      border: 1px solid #333;
      padding: 15px;
      margin: 20px 0;
      border-radius: 5px;
    }
    .pass {
      color: #00ff00;
    }
    .fail {
      color: #ff0000;
    }
    .info {
      color: #00aaff;
    }
    pre {
      background: #000;
      padding: 10px;
      border-left: 3px solid #00ff00;
      overflow-x: auto;
    }
    #results {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>🧠 Epic 13: Cognitive Metrics Data Engine - Test Suite</h1>

  <div class="test-section">
    <h2>📊 Test Status</h2>
    <div id="status">Initializing tests...</div>
  </div>

  <div class="test-section">
    <h2>📝 Test Results</h2>
    <pre id="results"></pre>
  </div>

  <script>
    // Simple assertion library
    window.assert = {
      equal: (actual, expected, message) => {
        if (actual !== expected) {
          throw new Error(`${message} - Expected: ${expected}, Got: ${actual}`);
        }
        console.log(`✅ ${message}`);
      },
      isTrue: (value, message) => {
        if (!value) {
          throw new Error(`${message} - Expected true, got ${value}`);
        }
        console.log(`✅ ${message}`);
      },
      isFalse: (value, message) => {
        if (value) {
          throw new Error(`${message} - Expected false, got ${value}`);
        }
        console.log(`✅ ${message}`);
      },
      isNull: (value, message) => {
        if (value !== null) {
          throw new Error(`${message} - Expected null, got ${value}`);
        }
        console.log(`✅ ${message}`);
      }
    };

    // Capture console output
    const resultsDiv = document.getElementById('results');
    const statusDiv = document.getElementById('status');

    const originalLog = console.log;
    const originalError = console.error;

    let testOutput = '';
    let passCount = 0;
    let failCount = 0;

    console.log = (...args) => {
      const message = args.join(' ');
      testOutput += message + '\n';
      resultsDiv.textContent = testOutput;

      if (message.includes('✅')) {
        passCount++;
      }

      originalLog.apply(console, args);
    };

    console.error = (...args) => {
      const message = args.join(' ');
      testOutput += message + '\n';
      resultsDiv.textContent = testOutput;

      if (message.includes('❌')) {
        failCount++;
      }

      originalError.apply(console, args);
    };

    // Update status periodically
    setInterval(() => {
      statusDiv.innerHTML = `
        <span class="pass">✅ Passed: ${passCount}</span> |
        <span class="fail">❌ Failed: ${failCount}</span>
      `;
    }, 100);
  </script>

  <!-- Load test files as ES6 modules -->
  <script type="module" src="storage.test.js"></script>
  <script type="module" src="metrics.test.js"></script>

  <script>
    // Final summary after tests complete
    setTimeout(() => {
      const total = passCount + failCount;
      statusDiv.innerHTML = `
        <h3>Final Results:</h3>
        <span class="pass">✅ Passed: ${passCount}</span> |
        <span class="fail">❌ Failed: ${failCount}</span> |
        <span class="info">Total: ${total}</span>
        <br><br>
        ${failCount === 0 ? '<span class="pass">🎉 ALL TESTS PASSED!</span>' : '<span class="fail">⚠️ Some tests failed</span>'}
      `;
    }, 5000);
  </script>
</body>
</html>
