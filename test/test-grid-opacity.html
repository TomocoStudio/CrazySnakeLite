<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Opacity Progression Tests - CrazySnakeLite</title>
  <style>
    body {
      font-family: monospace;
      background: #1a1a1a;
      color: #00ff00;
      padding: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 {
      color: #9D4EDD;
      border-bottom: 2px solid #9D4EDD;
      padding-bottom: 10px;
    }
    #console {
      background: #000;
      padding: 20px;
      border-radius: 5px;
      border: 1px solid #333;
      min-height: 400px;
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.5;
    }
    .pass { color: #00ff00; }
    .fail { color: #ff0000; }
    .info { color: #9D4EDD; }
  </style>
</head>
<body>
  <h1>🧪 Grid Opacity Progression Tests</h1>
  <p>Story 20.3: Create Progressive Grid Opacity System</p>
  <div id="console"></div>

  <script type="module">
    // Intercept console.log to display in page
    const consoleDiv = document.getElementById('console');
    const originalLog = console.log;
    const originalError = console.error;

    console.log = function(...args) {
      const message = args.join(' ');
      const span = document.createElement('span');
      span.className = message.includes('✅') ? 'pass' : message.includes('===') ? 'info' : '';
      span.textContent = message + '\n';
      consoleDiv.appendChild(span);
      originalLog.apply(console, args);
    };

    console.error = function(...args) {
      const message = args.join(' ');
      const span = document.createElement('span');
      span.className = 'fail';
      span.textContent = message + '\n';
      consoleDiv.appendChild(span);
      originalError.apply(console, args);
    };

    // Import and run tests
    import('./grid-opacity.test.js').catch(err => {
      console.error('Failed to load tests:', err);
    });
  </script>
</body>
</html>
