<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Epic 19: Glow Tier Accuracy Test</title>
  <style>
    body {
      font-family: monospace;
      background: #1a1a1a;
      color: #00ff00;
      padding: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 {
      color: #9D4EDD;
      border-bottom: 2px solid #9D4EDD;
      padding-bottom: 10px;
    }
    #console {
      background: #000;
      padding: 20px;
      border-radius: 5px;
      border: 1px solid #333;
      min-height: 400px;
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.5;
    }
    .pass { color: #00ff00; }
    .fail { color: #ff0000; }
    .info { color: #9D4EDD; }
  </style>
</head>
<body>
  <h1>🧪 Epic 19: Glow Tier Accuracy Test</h1>
  <p>Story 19.6: Verify glow intensity matches score thresholds</p>
  <div id="console"></div>

  <script type="module">
    const consoleDiv = document.getElementById('console');
    const originalLog = console.log;

    console.log = function(...args) {
      const message = args.join(' ');
      const span = document.createElement('span');

      if (message.includes('✅')) {
        span.className = 'pass';
      } else if (message.includes('❌')) {
        span.className = 'fail';
      } else if (message.includes('🧪') || message.includes('📊') || message.includes('=')) {
        span.className = 'info';
      }

      span.textContent = message + '\n';
      consoleDiv.appendChild(span);
      originalLog.apply(console, args);
    };

    import('./epic-19-tier-accuracy-test.js');
  </script>
</body>
</html>
