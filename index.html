<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crazy Snake - Chaotic Snake Game</title>
  <meta name="description" content="Classic Nokia Snake with chaotic twists - 6 food types, phone interruptions, pure chaos!">

  <!-- Plausible Analytics (privacy-first, cookie-free) -->
  <script async src="https://plausible.io/js/pa-5lDK3arREKbPzQ_2_Jhfm.js"></script>
  <script>
    window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
    plausible.init()
  </script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>

    <!-- Score Display - Story 5-2: Dual Score Layout -->
    <div id="score-display" class="hidden">
      <span id="current-score">Score: 0</span>
      <span id="top-score">Top Score: 0</span>
    </div>

    <!-- Feedback Button - Story 6.2: Always Visible -->
    <button id="feedback-button" class="feedback-button" aria-label="Give Feedback">
      <span class="feedback-button-text">Feedback</span>
      <span class="feedback-button-icon">💬</span>
    </button>

    <!-- Main Menu Screen - Story 4.2 -->
    <div id="menu-screen">
      <h1 class="game-title">Crazy Snake</h1>
      <button id="new-game-btn" class="menu-button">New Game</button>
      <div id="high-score-display">
        <p>Top Score: <span id="high-score-value">0</span></p>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="hidden">
      <h2>GAME OVER</h2>
      <p class="final-score">Your score: <span id="score-value">0</span></p>
      <p id="new-high-score-indicator" class="new-high-score hidden">*** NEW HIGH SCORE! ***</p>

      <!-- Cognitive Stats Container - Story 11.3 -->
      <!-- Story 14.2: Post-Game Highlights (RECAP) -->
      <div class="cognitive-stats hidden" role="region" aria-live="polite" aria-label="Game summary">
        <!-- RECAP header -->
        <div class="cognitive-stats-header">─── RECAP ───</div>

        <!-- Highlights container (2-3 lines) -->
        <div class="cognitive-stats-lines">
          <!-- Dynamically generated highlight lines with icons -->
        </div>

        <!-- Caller quote (Story 14.3) -->
        <div class="caller-quote hidden">
          <div class="quote-text"></div>
          <div class="quote-attribution">
            <img class="caller-portrait" src="" alt="">
            <span class="caller-name"></span>
          </div>
        </div>

        <!-- Post-game footer: Calibration or Streak (Stories 14.5, 14.6) -->
        <div class="post-game-footer hidden"></div>
      </div>

      <!-- Story 14.7: Play Again and Skill Map Buttons -->
      <div class="game-over-buttons">
        <button id="play-again-btn" class="game-over-btn selected">Play Again</button>
        <button id="skill-map-btn" class="game-over-btn">Skill Map</button>
      </div>
    </div>

    <!-- Phone Call Overlay - Story 3.1, Story 9.1: Two-button layout, Story 9.3: Countdown bar -->
    <div id="phone-overlay" class="hidden">
      <div class="phone-screen">
        <img src="assets/PhoneIcone01_256px.png" alt="Phone ringing" class="phone-icon">
        <p class="call-status">Incoming call...</p>
        <p class="caller-name">Mom</p>
        <p class="call-instructions">(Press Space to End or Enter to Pick Up)</p>

        <!-- Two-button layout - Story 9.1 -->
        <div id="phone-buttons">
          <button id="phone-btn-end" class="phone-btn">
            <span class="btn-label">End</span>
            <span class="btn-points">+1</span>
          </button>

          <button id="phone-btn-pickup" class="phone-btn phone-btn-pickup">
            <span class="btn-label">Pick Up</span>
            <span class="btn-bonus">+2</span>
          </button>
        </div>

        <!-- Countdown bar - Story 9.3: Pick Up timer -->
        <div id="phone-countdown-bar" class="hidden">
          <div id="countdown-bar-fill"></div>
        </div>
      </div>
    </div>

    <!-- Thank You Screen - Story 6.4 -->
    <div id="thank-you-screen" class="thank-you-screen hidden">
      <div class="thank-you-container">
        <div class="thank-you-content">
          <div class="thank-you-icon">🎉</div>
          <h2>Thanks!</h2>
          <p>Your feedback helps make Crazy Snake even better!</p>
          <button id="back-to-game-btn" class="btn btn-primary">Back to Game</button>
        </div>
      </div>
    </div>

    <!-- Feedback Modal - Story 6.1 -->
    <div id="feedback-modal" class="feedback-modal hidden">
      <div class="feedback-container">
        <div class="feedback-header">
          <h2>Share Your Feedback</h2>
          <button id="close-feedback-btn" class="close-btn" aria-label="Close feedback">✕</button>
        </div>

        <form id="feedback-form" class="feedback-form">
          <!-- Fun Rating -->
          <div class="rating-group">
            <label for="fun-rating">How fun is Crazy Snake?</label>
            <div id="fun-rating" class="star-rating" data-rating="0">
              <span class="star" data-value="1">☆</span>
              <span class="star" data-value="2">☆</span>
              <span class="star" data-value="3">☆</span>
              <span class="star" data-value="4">☆</span>
              <span class="star" data-value="5">☆</span>
            </div>
          </div>

          <!-- Difficulty Rating -->
          <div class="rating-group">
            <label for="difficulty-rating">How's the difficulty?</label>
            <div id="difficulty-rating" class="star-rating" data-rating="0">
              <span class="star" data-value="1">☆</span>
              <span class="star" data-value="2">☆</span>
              <span class="star" data-value="3">☆</span>
              <span class="star" data-value="4">☆</span>
              <span class="star" data-value="5">☆</span>
            </div>
          </div>

          <!-- Comments (optional) -->
          <div class="form-group">
            <label for="feedback-comments">Anything else to share? (optional)</label>
            <textarea
              id="feedback-comments"
              class="feedback-textarea"
              maxlength="500"
              placeholder="Your thoughts help make Crazy Snake better..."
              rows="4"
            ></textarea>
            <div class="char-counter">
              <span id="char-count">0</span>/500
            </div>
          </div>

          <!-- Email (optional) -->
          <div class="form-group">
            <label for="feedback-email">Want beta updates? (optional email)</label>
            <input
              type="email"
              id="feedback-email"
              class="feedback-email"
              placeholder="your@email.com"
            />
          </div>

          <!-- Submit Button -->
          <button type="submit" id="submit-feedback-btn" class="btn btn-primary">
            Submit Feedback
          </button>
        </form>
      </div>
    </div>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
